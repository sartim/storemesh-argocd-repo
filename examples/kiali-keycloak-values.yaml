# Non-applied example. Requires Kubernetes API OIDC trust/RBAC for per-user
# authorization; OIDC login alone is not sufficient. Use one issuer reachable
# by both the user's browser and Kiali, and register the exact Kiali root URL.
# See README.md before enabling this for any shared environment.
cr:
  spec:
    server:
      web_fqdn: localhost
      web_port: 20001
      web_root: /kiali
      web_schema: https
    auth:
      strategy: openid
      openid:
        issuer_uri: https://keycloak.example.com/realms/storemesh
        client_id: kiali
        scopes:
        - openid
        - profile
        - email
        - groups

# Kiali reads the client secret from Secret/kiali key oidc-secret in
# istio-system; do not place the secret in the custom resource or Git.
# kubectl -n istio-system create secret generic kiali \
#   --from-literal=oidc-secret="$KIALI_KEYCLOAK_CLIENT_SECRET"
# The example issuer/host values are placeholders, not a runnable local setup.
