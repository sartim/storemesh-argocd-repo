apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: storemesh-inventory-service
  namespace: argocd
spec:
  project: storemesh
  source:
    repoURL: https://github.com/sartim/storemesh-helm-repo
    targetRevision: main
    path: storemesh-inventory-service
    helm:
      values: |
        replicaCount: 1
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 128Mi
          config:
            keycloakIssuer: ""
            keycloakAudience: storemesh-bff
          serviceMonitor:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: storemesh-inventory-service
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
    managedNamespaceMetadata:
      labels:
        istio-injection: enabled
