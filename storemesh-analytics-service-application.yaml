apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: storemesh-analytics-service
  namespace: argocd
  labels:
    storemesh.io/optional: "true"
    storemesh.io/requires-external-kafka: "true"
spec:
  project: storemesh
  source:
    repoURL: https://github.com/sartim/storemesh-helm-repo
    targetRevision: main
    path: storemesh-analytics-service
    helm:
      values: |
        replicaCount: 1
        kafka:
          brokers: ""
        externalSecrets:
          enabled: true
          secretStoreRef:
            name: storemesh-secrets
            kind: ClusterSecretStore
          remoteKey: storemesh/analytics
          targetName: storemesh-analytics-service-secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: storemesh-analytics-service
  syncPolicy:
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
    managedNamespaceMetadata:
      labels:
        istio-injection: enabled
