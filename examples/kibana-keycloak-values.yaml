# Non-applied ECK example. Kibana OIDC SSO requires an Elastic subscription
# that includes SSO (not the default free Basic license). Configure the
# Elasticsearch OIDC realm and Kibana provider together. Store the client
# secret in an ECK secure-settings Secret; never commit it in this file.
elasticsearch:
  spec:
    secureSettings:
    - secretName: storemesh-kibana-keycloak
    config:
      xpack.security.authc.realms.oidc.oidc1.order: "2"
      xpack.security.authc.realms.oidc.oidc1.rp.client_id: kibana
      xpack.security.authc.realms.oidc.oidc1.rp.response_type: code
      xpack.security.authc.realms.oidc.oidc1.rp.redirect_uri: http://localhost:5601/api/security/oidc/callback
      xpack.security.authc.realms.oidc.oidc1.op.issuer: https://keycloak.example.com/realms/storemesh
      xpack.security.authc.realms.oidc.oidc1.op.authorization_endpoint: https://keycloak.example.com/realms/storemesh/protocol/openid-connect/auth
      xpack.security.authc.realms.oidc.oidc1.op.token_endpoint: https://keycloak.example.com/realms/storemesh/protocol/openid-connect/token
      xpack.security.authc.realms.oidc.oidc1.op.jwkset_path: https://keycloak.example.com/realms/storemesh/protocol/openid-connect/certs
      xpack.security.authc.realms.oidc.oidc1.op.userinfo_endpoint: https://keycloak.example.com/realms/storemesh/protocol/openid-connect/userinfo
      xpack.security.authc.realms.oidc.oidc1.claims.principal: preferred_username
      xpack.security.authc.realms.oidc.oidc1.claims.groups: groups
      xpack.security.authc.realms.oidc.oidc1.claims.name: name
      xpack.security.authc.realms.oidc.oidc1.claims.mail: email
kibana:
  config:
    xpack.security.authc.providers:
      oidc.oidc1.order: 0
      oidc.oidc1.realm: oidc1
      basic.basic1.order: 1

# The secure-settings Secret should contain this key out of band:
# xpack.security.authc.realms.oidc.oidc1.rp.client_secret: <secret>
