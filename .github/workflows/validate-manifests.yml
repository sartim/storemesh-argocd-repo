name: Validate manifests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  yaml:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Parse YAML
      shell: bash
      run: |
        ruby -e 'require "yaml"; ARGV.each { |file| YAML.load_stream(File.read(file), aliases: true); puts "ok #{file}" }' \
          $(find . -type f \( -name "*.yaml" -o -name "*.yml" \) -not -path "./.git/*")
    - name: Check whitespace
      run: git diff --check
