# Non-applied example. Replace the shared issuer placeholder and public
# Grafana root URL. The issuer must resolve from both browser and Grafana pod.
# Merge only after creating the Secret in storemesh-monitoring.
grafana:
  grafana.ini:
    server:
      root_url: http://localhost:3001/
    auth.generic_oauth:
      enabled: true
      name: Keycloak
      allow_sign_up: true
      client_id: grafana
      scopes: openid profile email groups
      auth_url: https://keycloak.example.com/realms/storemesh/protocol/openid-connect/auth
      token_url: https://keycloak.example.com/realms/storemesh/protocol/openid-connect/token
      api_url: https://keycloak.example.com/realms/storemesh/protocol/openid-connect/userinfo
      # Keycloak maps realm roles to the groups claim for platform clients.
      groups_attribute_path: groups
      allowed_groups: observability-admin operator
      role_attribute_strict: true
      # Restrict Grafana org-admin to the dedicated observability-admin role.
      role_attribute_path: contains(groups[*], 'observability-admin') && 'Admin' || 'Viewer'
  envFromSecret: storemesh-grafana-keycloak

# Create the referenced Secret out of band. Never commit its value:
# kubectl -n storemesh-monitoring create secret generic storemesh-grafana-keycloak \
#   --from-literal=client_secret="$GRAFANA_KEYCLOAK_CLIENT_SECRET"
