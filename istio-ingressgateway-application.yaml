apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-ingressgateway
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: storemesh
spec:
  project: storemesh
  source:
    repoURL: https://istio-release.storage.googleapis.com/charts
    chart: gateway
    targetRevision: 1.30.3
    helm:
      values: |
        image: docker.io/istio/proxyv2:1.30.3
        service:
          type: LoadBalancer
        podAnnotations:
          sidecar.istio.io/proxyImage: docker.io/istio/proxyv2:1.30.3
        global:
          hub: docker.io/istio
          tag: 1.30.3
        autoscaling:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-ingress
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
